<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />
  
  <!-- Subtle Islamic Geometric Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-dasharray="8 8" opacity="0.4" />
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.6" />

  <!-- Quran Stand / Open Book Silhouette -->
  <g transform="translate(106, 126)">
    <!-- Left Page -->
    <path d="M 150 200 C 90 190 20 220 0 240 L 0 50 C 20 30 90 0 150 10 Z" fill="#fdfbf7" stroke="url(#goldGrad)" stroke-width="5" />
    <!-- Right Page -->
    <path d="M 150 200 C 210 190 280 220 300 240 L 300 50 C 280 30 210 0 150 10 Z" fill="#fcf9f2" stroke="url(#goldGrad)" stroke-width="5" />
    <!-- Book Spine & Binding -->
    <path d="M 146 10 L 154 10 L 154 205 L 146 205 Z" fill="#b45309" />
    <!-- Golden Quran Calligraphy Silhouette Motif / Crest -->
    <circle cx="75" cy="115" r="36" fill="none" stroke="url(#goldGrad)" stroke-width="3" />
    <path d="M 65 115 Q 75 95 85 115 Q 75 135 65 115" fill="url(#goldGrad)" />
    
    <circle cx="225" cy="115" r="36" fill="none" stroke="url(#goldGrad)" stroke-width="3" />
    <path d="M 215 115 Q 225 95 235 115 Q 225 135 215 115" fill="url(#goldGrad)" />
    
    <!-- Base Rihal Wooden Stand -->
    <path d="M 50 240 L 250 240 L 280 280 L 20 280 Z" fill="#78350f" opacity="0.8" />
  </g>
</svg>
